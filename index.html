
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JoinUs | Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
            background: linear-gradient(135deg, #667eea, #764ba2, #a855f7);
        }

        .container {
            width: 100%;
            max-width: 460px;
            background: white;
            padding: 38px;
            border-radius: 24px;
            box-shadow: 0 20px 55px rgba(25, 20, 70, 0.25);
        }

        .logo {
            width: 65px;
            height: 65px;
            margin: 0 auto 18px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            font-size: 30px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            color: #202344;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777b91;
            font-size: 14px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #34364f;
            font-weight: 600;
            font-size: 14px;
            margin-bottom: 9px;
        }

        .input-box {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 14px;
            border: 1px solid #e1e3ed;
            border-radius: 12px;
            background: #fafaff;
            transition: 0.2s;
        }

        .input-box:focus-within {
            border-color: #7864db;
            box-shadow: 0 0 0 3px rgba(120, 100, 219, 0.12);
            background: white;
        }

        .input-box span {
            font-size: 18px;
        }

        input {
            width: 100%;
            min-width: 0;
            padding: 15px 0;
            border: none;
            outline: none;
            background: transparent;
            font-size: 14px;
            color: #252740;
        }

        input::placeholder {
            color: #a4a6b6;
        }

        .hint {
            margin-top: 7px;
            font-size: 12px;
            color: #85889c;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 6px;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(135deg, #667eea, #764ba2);
            box-shadow: 0 8px 18px rgba(102, 126, 234, 0.25);
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(102, 126, 234, 0.35);
        }

        .message {
            display: none;
            margin-top: 18px;
            padding: 12px;
            border-radius: 10px;
            text-align: center;
            font-size: 14px;
            background: #e8fff1;
            color: #167344;
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: #999bad;
            margin-top: 25px;
        }

        @media (max-width: 480px) {
            .container {
                padding: 27px 22px;
            }

            h1 {
                font-size: 25px;
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="logo" aria-hidden="true">✦</div>

        <h1>Create Account</h1>
        <p class="subtitle">
            Join our community today.<br>
            Fill in your details to get started.
        </p>

        <form id="registrationForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <div class="input-box">
                    <span aria-hidden="true">👤</span>
                    <input type="text" id="name" name="name"
                           placeholder="Enter your full name"
                           autocomplete="name" required>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-box">
                    <span aria-hidden="true">✉️</span>
                    <input type="email" id="email" name="email"
                           placeholder="you@example.com"
                           autocomplete="email" required>
                </div>
            </div>

            <div class="form-group">
                <label for="contact">Contact Number</label>
                <div class="input-box">
                    <span aria-hidden="true">📱</span>
                    <input type="tel" id="contact" name="contact"
                           placeholder="Enter contact number"
                           autocomplete="tel" required>
                </div>
                <p class="hint">Please enter a valid contact number.</p>
            </div>

            <button type="submit">Create My Account →</button>

            <div class="message" id="successMessage" role="status">
                ✓ Form submitted successfully!
            </div>
        </form>

        <footer>Registration Form · Built with HTML & CSS</footer>
    </main>

    <script>
        document.getElementById("registrationForm")
            .addEventListener("submit", function(event) {
                event.preventDefault();

                document.getElementById("successMessage")
                    .style.display = "block";
            });
    </script>
</body>
</html>
